# Configuring hypridle
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# 
# hypridle.conf - Hypridle configuration for HyDE
# Handles idle actions: dim, lock, DPMS, suspend, and custom listeners
# 
# Listeners: Each listener block defines an idle timeout and actions to run
# 
# For more info, see: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

#!      ░▒▒▒░░░▓▓           ___________
#!    ░░▒▒▒░░░░░▓▓        //___________/
#!   ░░▒▒▒░░░░░▓▓     _   _ _    _ _____
#!   ░░▒▒░░░░░▓▓▓▓▓ | | | | |  | |  __/
#!    ░▒▒░░░░▓▓   ▓▓ | |_| | |_/ /| |___
#!     ░▒▒░░▓▓   ▓▓   \__  |____/ |____/
#!       ░▒▓▓   ▓▓  //____/

$LOCK_CMD = ~/.local/bin/lock-workspaces # Custom lock with clean earth background on both monitors
$UNLOCK_CMD = sh -c 'sleep 3 && pkill -9 $(hyde-shell lockscreen --get)' # kills the lockscreen after 3 seconds for cleanup

general {
    lock_cmd = $LOCK_CMD # command when `loginctl lock-session` is called
    unlock_cmd = $UNLOCK_CMD # command when `loginctl unlock-session` is called
    ignore_dbus_inhibit = false             # Ignore dbus idle-inhibit requests (false = respect them)
    ignore_systemd_inhibit = false          # Ignore systemd-inhibit --what=idle (false = respect them)
    before_sleep_cmd = sh -c 'loginctl lock-session && sleep 2'   # Delay sleep to allow screenshot to finish
    # after_sleep_cmd = # notify-send "Awake!"  # command ran after sleep
}

# // --- Listener: Dim display after 60s idle ---
listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1% # Save and set brightness to 1%
    on-resume = brightnessctl -r # Restore brightness on activity
}

# // --- Listener: Lock after 5min idle ---
# Locks the session before DPMS off, so the screen is not visible after wake
listener {
    timeout = 300
    on-timeout = loginctl lock-session # Try system lock, fallback to $LOCKSCREEN
}

# Super+L is hyde-shell lock-session (HyDE). 10s later, blank while hyprlock is up.
# Uses ~/.local/bin/hypr-dpms (same Lua eval as below, live socket + DDC).
listener {
    timeout = 10
    on-timeout = /home/btw/.local/bin/hypr-dpms-if-locked off
    on-resume = /home/btw/.local/bin/hypr-dpms on
}

# // --- Listener: DPMS off after 6min idle ---
# Turns off display (but not if media is playing)
# hypr-dpms = Hyprland 0.56 Lua eval + bind live instance (stale HIS breaks dispatch)
listener {
    timeout = 360
    on-timeout = /home/btw/.local/bin/hypr-dpms off
    on-resume = /home/btw/.local/bin/hypr-dpms on
}

# // --- Listener: Suspend after 1hr idle ---
listener {
    timeout = 3600
    on-timeout = systemctl suspend # Suspend system
}


# Configuring hypridle
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# hypridle.conf - Hypridle configuration for HyDE (machine-tuned for btw)
# Dual NVIDIA DP: never DDC-power-off, never idle-suspend from a TTY.

#!      ░▒▒▒░░░▓▓           ___________
#!    ░░▒▒▒░░░░░▓▓        //___________/
#!   ░░▒▒▒░░░░░▓▓     _   _ _    _ _____
#!   ░░▒▒░░░░░▓▓▓▓▓ | | | | |  | |  __/
#!    ░▒▒░░░░▓▓   ▓▓ | |_| | |_/ /| |___
#!     ░▒▒░░▓▓   ▓▓   \__  |____/ |____/
#!       ░▒▓▓   ▓▓  //____/

$LOCK_CMD = /home/btw/.local/bin/hypr-if-session-active /home/btw/.local/bin/lock-workspaces
$UNLOCK_CMD = sh -c 'sleep 3 && pkill -9 $(hyde-shell lockscreen --get)' # kills the lockscreen after 3 seconds for cleanup

general {
    lock_cmd = $LOCK_CMD # command when `loginctl lock-session` is called
    unlock_cmd = $UNLOCK_CMD # command when `loginctl unlock-session` is called
    ignore_dbus_inhibit = false             # Ignore dbus idle-inhibit requests (false = respect them)
    ignore_systemd_inhibit = false          # Ignore systemd-inhibit --what=idle (false = respect them)
    # 3 = wait until the Wayland session lock exists. Auto (2) only waits if
    # lock_cmd contains the substring "hyprlock"; ours is lock-workspaces.
    inhibit_sleep = 3
    before_sleep_cmd = /home/btw/.local/bin/hypr-if-session-active sh -c 'loginctl lock-session && sleep 2'
    after_sleep_cmd = /home/btw/.local/bin/hypr-restore-outputs
}

# brightnessctl's default device here is a NIC LED (enp5s0-3::lan), not the
# panels. HyDE's 60s dim listener is a no-op on the screens and races restore.

# // --- Listener: Lock after 10min idle ---
listener {
    timeout = 600
    on-timeout = /home/btw/.local/bin/hypr-if-session-active loginctl lock-session
}

# // --- Listener: compositor blank after 15min idle ---
# hypr-dpms is compositor DPMS only. DDC VCP D6=5 physically powered off DP-1
# and NVIDIA then left both heads disabled when the panels were powered back.
listener {
    timeout = 900
    on-timeout = /home/btw/.local/bin/hypr-dpms off
    on-resume = /home/btw/.local/bin/hypr-dpms on
}

# // --- Listener: Suspend after 1hr idle (not while a TTY owns the seat) ---
listener {
    timeout = 3600
    on-timeout = /home/btw/.local/bin/hypr-if-session-active systemctl suspend
}

